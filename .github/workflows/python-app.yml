name: Python CI + Docker Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gita

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q

  docker-push:
    runs-on: ubuntu-latest
    needs: test   # Only runs if tests pass

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DU }}
          password: ${{ secrets.DP }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./gita
          file: ./gita/Dockerfile
          push: true
          tags: ${{ secrets.DU }}/sapp:latest
